    margin-bottom: 12px;
}

.welcome p {
    color: #dddddd;
    line-height: 1.7;
}

/* GUITAR CARDS */
.lessons {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.card {
    background: #1b1b1b;
    border: 1px solid #725d20;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
}

.card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
}

.card-content {
    padding: 20px;
}

.card h3 {
    color: #d4af37;
    font-size: 22px;
    margin-bottom: 10px;
}

.card p {
    color: #dddddd;
    line-height: 1.6;
}

.price {
    color: #d4af37;
    font-weight: bold;
    font-size: 19px;
    margin-top: 15px;
}

.time {
    margin-top: 6px;
    color: #cccccc;
}

/* MUSIC LESSONS */
.section-title {
    text-align: center;
    margin-top: 35px;
}

.skills {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
}

.skill {
    background: #1b1b1b;
    border-left: 3px solid #d4af37;
    padding: 18px;
    border-radius: 10px;
}

.skill h3 {
    color: #d4af37;
    margin-bottom: 8px;
}

.skill p {
    color: #cccccc;
    line-height: 1.5;
