    background: linear-gradient(145deg, #302718, #111111);
    border: 1px solid #d4af37;
    border-radius: 18px;
}

.booking h2 {
    color: #d4af37;
    margin-bottom: 12px;
}

.whatsapp {
    display: inline-block;
    margin-top: 18px;
    padding: 14px 25px;
    background: #25D366;
    color: white;
    text-decoration: none;
    border-radius: 30px;
    font-family: Arial, sans-serif;
    font-weight: bold;
}

/* BOTTOM NAVIGATION */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 70px;
    background: #090909;
    border-top: 1px solid #725d20;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 100;
}

.nav-item {
