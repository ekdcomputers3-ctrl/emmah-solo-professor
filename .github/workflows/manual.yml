<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #101010;
    color: white;
    padding-bottom: 80px;
}

/* HEADER */
header {
    text-align: center;
    padding: 35px 15px;
    background: linear-gradient(145deg, #111111, #302718, #111111);
    border-bottom: 2px solid #d4af37;
}

.logo {
    color: #d4af37;
    font-size: 28px;
    font-weight: bold;
}

.subtitle {
